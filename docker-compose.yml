version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tixxgo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-tixxgo_db}
      MYSQL_USER: ${DB_USER:-tixxgo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tixxgo_pass}
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - tixxgo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tixxgo_mysql_data:
    driver: local
